AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Gold layer ETL — aggregates silver ENTSOE data into reporting-ready tables

Globals:
  Function:
    Timeout: 900
    Runtime: python3.13
    Architectures:
      - x86_64

Resources:
  GoldEntsoeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: data-lake-energy-trade-gold-entsoe
      CodeUri: src/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          SILVER_BUCKET: data-lake-energy-trade
          SILVER_PREFIX: silver/entsoe
          GOLD_BUCKET: data-lake-energy-trade
          GOLD_PREFIX: gold/entsoe
      Policies:
        - S3ReadPolicy:
            BucketName: data-lake-energy-trade
        - S3WritePolicy:
            BucketName: data-lake-energy-trade
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            # Runs at 04:00 UTC every day — silver ETL finishes well before this
            Schedule: cron(0 4 * * ? *)
            Input: '{}'

Outputs:
  FunctionName:
    Value: !Ref GoldEntsoeFunction

  FunctionArn:
    Value: !GetAtt GoldEntsoeFunction.Arn
